services:
  llama:
    build: .
    runtime: nvidia
    network_mode: host
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/.model-config:/root/.model-config
      
    # Pass your custom llama-server arguments here
    command: 
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-cram"
      - "2000"
      - "-np"
      - "1"
      - "--temp"
      - "0.2"
      - "--cache-prompt"
      - "--cache-reuse"
      - "256"
      - "--swa-full"
      - "--models-max"
      - "1"
      - "-fa"
      - "on"
      - "-c"
      - "8000"
      - "-ctv"
      - "q8_0"      
      - "-ctk"
      - "q8_0"
      - "--verbosity"
      - "4"
      - "--fit"
      - "off"
      - "-b"
      - "2048"
      - "-ub"
      - "1024"
