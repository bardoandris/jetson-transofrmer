services:
  llama:
    build: .
    runtime: nvidia
    network_mode: host
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    # Pass your custom llama-server arguments here
    command: 
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-cram"
      - "1500"
      - "-np"
      - "1"
      - "--temp"
      - "0.2"
      - "-hf"
      - "Qwen/Qwen3-VL-4B-Instruct-GGUF:Q4_K_M"



      # Example: add model load parameters
      # - "--hf-rep
      # - "ggml-org/gemma-3-4b-it-GGUF"
      # - "--hf-file"
      # - "gemma-3-4b-it-Q4_K_M.gguf"
